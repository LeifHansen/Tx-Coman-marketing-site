# Netlify configuration — static site, no build step.
[build]
  publish = "."
  command = ""

# Serve /hemp-beverage-co-packing instead of /hemp-beverage-co-packing.html
[build.processing.html]
  pretty_urls = true

# Legacy/alias paths → canonical pages
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
